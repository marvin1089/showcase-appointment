<div class="container">
    <div class="card mt-3">
        <div class="row">
            <div class="col">
                <h2 class="text-center">Create new Appointment</h2>
            </div>
        </div>
    <div class="card mt-3">
                <div class="col-md-6">
                <input  class="form-control" [(ngModel)]="newAppointmentTitle" type="text" placeholder="Appointment title">
        </div>
                <div class="col-md-4">
                <input class="form-control" [(ngModel)]="newAppointmentDate" type="date" placeholder="Appointment date">
        </div>
                <div class="col-md-2">
                <button class="btn btn-primary w-100" (click)="addAppointment()">Add</button>
        </div>
      </div>
    </div>

<h2 class="text-center mt-4">Appointments</h2>
<ul class="list-group mt-3">
    <li *ngFor="let appointment of appointments; index as i">
        {{ appointment.title }}
        {{ appointment.date | date:'dd.MM.yyyy' }}

        <button 
            style="background: red; color: white; margin-left: 20px;"
            (click)="deleteAppointment(i)">
            Delete
        </button>
    </li>
</ul>
</div>
